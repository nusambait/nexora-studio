[package]
name = "nexora-studio"
version = "0.1.0"
edition = "2021"
authors = ["NEXORA Studio Contributors"]
description = "Compact, modern native desktop screen recording studio for Windows"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wgpu",
] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_Devices_DeviceAndDriverInstallation"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2


